<div class="min-h-screen w-full bg-slate-50">

  <!-- Top Header Navbar (logo pinned left, links pinned right) -->
  <header class="w-full bg-[#1E3A5F] border-b-4 border-amber-500 shadow-md">
    <div class="w-full px-6 lg:px-12 h-20 flex items-center justify-between">
      <!-- Logo & Brand (left side) -->
      <div class="flex items-center gap-3">
        <img src="assets/logo.png" alt="USLT Logo" class="w-12 h-12 object-contain rounded-lg" />
        <h1 class="text-xl font-bold text-white tracking-tight">InternLink GLOCAL</h1>
      </div>

      <!-- Quick Links (right side) -->
      <nav class="hidden md:flex items-center space-x-6 text-sm font-medium text-slate-200">
        <a href="#" class="hover:text-white transition-colors">USL Website</a>
        <a href="#" class="hover:text-white transition-colors">FAQ's</a>
        <a href="#" class="hover:text-white transition-colors">Contact Information</a>
        <a href="#" class="hover:text-white transition-colors">Disclaimer</a>
        <a href="#" class="hover:text-white transition-colors">Terms of Use</a>
      </nav>
    </div>
  </header>

  <!-- Main Body (vertically centered below header) -->
  <main class="min-h-[calc(100vh-5rem)] w-full flex items-center justify-center py-12 px-6 lg:px-12">
    <div class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-12 items-center">

      <!-- Left Column: branding only -->
      <div class="lg:col-span-5 flex flex-col justify-center space-y-8">
        <div>
          <h1 class="text-3xl sm:text-4xl font-bold text-[#1E3A5F] leading-tight">
            Welcome to the InternLink GLOCAL Portal
          </h1>
          <p class="mt-2 text-sm text-slate-500">
            University of Saint Louis Tuguegarao
            <span class="block">&#8226; Internship Management System</span>
          </p>
        </div>
      </div>

      <!-- Right Column: sign-in form -->
      <div class="lg:col-span-7 flex justify-center lg:justify-end">
        <div class="w-full max-w-lg bg-white rounded-3xl border border-slate-200/80 shadow-xl p-8 sm:p-10 space-y-6">
          <h2 class="text-2xl font-bold text-[#1E3A5F]">Sign In</h2>

          <form (ngSubmit)="onSubmit()" class="flex flex-col gap-4" novalidate>

            <!-- Email Field -->
            <div class="flex flex-col gap-2">
              <label for="email" class="text-sm font-semibold text-slate-700">Email Address</label>
              <div class="relative rounded-xl border border-slate-200 bg-slate-100/80 flex items-center">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center w-5 h-5 text-slate-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2 .9-2 2V6c0-1.1.9-2 2-2z" />
                  <polyline points="22,6 12,13 2,6" />
                </svg>
                <input
                  id="email"
                  type="email"
                  placeholder="name@uslt.edu.ph"
                  [(ngModel)]="email"
                  name="email"
                  required
                  class="w-full pl-10 pr-4 py-3.5 text-sm text-slate-900 outline-none bg-transparent border-none focus:ring-0"
                />
              </div>
            </div>

            <!-- Password Field -->
            <div class="flex flex-col gap-2">
              <div class="flex justify-between items-center">
                <label for="password" class="text-sm font-semibold text-slate-700">Password</label>
                <a href="#" class="text-xs font-medium text-slate-500 hover:text-[#1E3A5F]" (click)="$event.preventDefault(); $event.stopPropagation()">Forgot Password?</a>
              </div>
              <div class="relative rounded-xl border border-slate-200 bg-slate-100/80 flex items-center">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 flex items-center w-5 h-5 text-slate-400 pointer-events-none" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                  <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
                <input
                  id="password"
                  type="password"
                  placeholder="••••••••••••"
                  [(ngModel)]="password"
                  name="password"
                  required
                  class="w-full pl-10 pr-4 py-3.5 text-sm text-slate-900 outline-none bg-transparent border-none focus:ring-0"
                />
              </div>
            </div>

<!-- Bottom Horizontal Button Row -->
            <div class="flex items-center gap-3 pt-2">
              <button
                type="submit"
                [disabled]="isSigningIn"
                class="flex-1 bg-[#1E3A5F] hover:not([disabled]):bg-[#162C49] text-white font-semibold py-3.5 rounded-xl shadow-sm transition-all disabled:opacity-60 disabled:cursor-not-allowed"
              >
                <span *ngIf="!isSigningIn">Sign In</span>
                <span *ngIf="isSigningIn" class="flex items-center justify-center gap-2">
                  <svg class="w-5 h-5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    <path d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                  </svg>
                  Signing in...
                </span>
              </button>
            </div>

          </form>
        </div>
      </div>

      <!-- Error Popup Notification -->
      <div *ngIf="showErrorPopup" class="fixed inset-0 z-50 flex items-center justify-center">
        <!-- Backdrop -->
        <div
          class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm"
          (click)="closeErrorPopup()"
        ></div>

        <!-- Popup Card -->
        <div class="relative w-full max-w-md mx-4 bg-white rounded-3xl border border-slate-200/80 shadow-2xl p-8 sm:p-10">
          <div class="flex items-start gap-3">
            <div class="w-10 h-10 rounded-xl bg-red-100 text-red-600 flex items-center justify-center shrink-0 mt-0.5">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 8v5m0 1.5V16m-7.25-4a7.25 7.25 0 1 1 14.5 0a7.25 7.25 0 0 1-14.5 0Z" stroke-linejoin="round"/>
              </svg>
            </div>
            <div>
              <h3 class="text-lg font-bold text-slate-900 mb-1">Account Not Found</h3>
              <p class="text-slate-600 text-sm">{{ errorPopupMessage }}</p>
            </div>
          </div>

          <div class="mt-6 flex justify-end">
            <button
              type="button"
              (click)="closeErrorPopup()"
              class="bg-[#1E3A5F] hover:bg-[#162C49] text-white font-semibold px-6 py-2 rounded-xl shadow-sm transition-colors"
            >
              OK
            </button>
          </div>
        </div>
      </div>

    </div>
  </main>

</div>
