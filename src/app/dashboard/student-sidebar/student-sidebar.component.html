<aside
  class="w-full md:w-72 fixed left-0 top-0 h-auto md:h-screen overflow-y-auto bg-[#1E3A5F] text-white flex flex-col z-[50]"
  [class.-translate-x-full]="isMobile() && !isSidebarOpen()"
  [class.translate-x-0]="isMobile() && isSidebarOpen()"
>
  <!-- Brand block -->
  <div class="h-20 flex items-center border-b border-white/15 px-6">
    <div class="flex items-center gap-4">
      <img src="assets/logo.png" alt="USLT Logo" class="w-10 h-10 shrink-0 rounded-xl" />
      <div class="min-w-0">
        <h1 class="truncate text-base font-extrabold tracking-tight text-white">InternLink GLOCAL</h1>
        <p class="mt-1 text-sm text-slate-400">University Of Saint Louis Tuguegarao</p>
      </div>
    </div>
  </div>

  <!-- Section header -->
  <div class="px-6 pt-6">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-900/20 border border-amber-500/30 text-amber-400 ring-1 ring-amber-500/20">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path d="M2 10 12 5l10 5-10 5-10-5Z" />
          <path d="M6 12v5" />
        </svg>
      </div>
      <div>
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-400">STUDENT PORTAL</p>
        <p class="mt-1 text-sm text-slate-400">Requirements tracking &amp; HTE applications</p>
      </div>
    </div>
  </div>

  <!-- Navigation -->
  <nav class="mt-6 flex-1 px-3 pb-6" aria-label="Main menu">
    <a *ngFor="let item of menuItems; trackBy: trackBySidebar"
       #rla="routerLinkActive"
       [routerLink]="item.route"
       routerLinkActive="bg-amber-900/20 text-white ring-1 ring-amber-500/30 border-amber-500"
       [routerLinkActiveOptions]="{ exact: true }"
       class="group mb-1 flex w-full items-center gap-3 rounded-2xl border-l-4 border-transparent px-4 py-3 text-left text-sm font-medium text-slate-200 transition hover:bg-slate-800/50 hover:text-amber-300">

      <!-- Icon tile (every svg has explicit w-5 h-5) -->
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-slate-400 transition group-hover:bg-slate-800 group-hover:text-amber-300"
            [ngClass]="rla.isActive ? 'bg-amber-600 text-white' : ''">
        <ng-container [ngSwitch]="item.icon">
          <svg class="w-5 h-5" *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z" stroke-linejoin="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'building'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 21V7l8-4 8 4v14H4Z" stroke-linejoin="round" />
            <path d="M12 3v18" stroke-linecap="round" />
            <path d="M8 11h2M8 15h2M14 11h2M14 15h2" stroke-linecap="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'file'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
            <path d="M14 3v5h5" stroke-linejoin="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'user'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
            <path d="M4 21a8 8 0 0 1 16 0" stroke-linecap="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'file-check'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
            <path d="M14 3v5h5" stroke-linejoin="round" />
            <path d="m9 15 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'bell'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 21a2 2 0 0 0 4 0" stroke-linecap="round" />
          </svg>
          <svg class="w-5 h-5" *ngSwitchCase="'user-profile'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4Z" />
            <path d="M5 21a7 7 0 0 1 14 0" stroke-linecap="round" />
          </svg>
        </ng-container>
      </span>

      <!-- Label -->
      <span class="flex-1">{{ item.label }}</span>

      <!-- Optional suffix -->
      <span *ngIf="item.suffix" class="text-[10px] font-bold uppercase tracking-[0.25em] text-slate-500">{{ item.suffix }}</span>

      <!-- Active chevron -->
      <svg class="w-4 h-4 text-slate-300" *ngIf="rla.isActive" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </nav>

  <!-- Live-Sync footer -->
  <div class="border-t border-white/10 px-6 py-4">
    <div class="flex items-center gap-2 text-xs">
      <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-slate-300">Live Sync</span>
    </div>
  </div>
</aside>
