<div class="min-h-screen bg-slate-50 text-slate-900 flex md:flex-row">
  <!-- Mobile sidebar backdrop -->
  <div *ngIf="isSidebarOpen()" class="fixed inset-0 z-20 bg-black/40 backdrop-blur-sm" (click)="closeSidebar()" aria-hidden="true"></div>

  <!-- Student sidebar (full-width stacked on mobile, beside content on desktop) -->
  <app-student-sidebar
    [isMobile]="isMobile()"
    [isSidebarOpen]="isSidebarOpen()"
  ></app-student-sidebar>

  <section class="flex min-w-0 flex-1 flex-col md:ml-72">
    <!-- Mobile hamburger + title bar -->
    <header class="md:hidden h-20 px-4 flex items-center gap-4 border-b border-slate-200 bg-white z-30">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex items-center justify-center h-10 w-10 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        [attr.aria-label]="isSidebarOpen() ? 'Close menu' : 'Open menu'"
      >
        <svg
          *ngIf="!isSidebarOpen()"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg
          *ngIf="isSidebarOpen()"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M6 18l12-12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <h1 class="flex-1 truncate text-base font-extrabold tracking-tight text-[#1E3A5F]">InternLink GLOCAL</h1>
    </header>

    <app-topbar></app-topbar>

    <main class="flex-1 w-full pt-44 pb-6 px-6 md:pt-28 md:pb-8 md:px-8 space-y-4">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-200 bg-white px-6 py-3 text-xs text-slate-500 flex items-center justify-between">
      <span>University of Saint Louis Tuguegarao • GLOCAL Management System</span>
      <span class="flex items-center gap-2">
        <span class="h-2 w-2 rounded-full bg-emerald-500"></span>
        System Status: Online • v1.0.0
      </span>
    </footer>
  </section>
</div>
