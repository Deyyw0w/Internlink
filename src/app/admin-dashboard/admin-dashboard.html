<div class="flex h-screen overflow-hidden bg-slate-50 text-slate-900 md:flex-row">
  <!-- Mobile sidebar backdrop -->
  <div *ngIf="isSidebarOpen()" class="fixed inset-0 z-20 bg-black/40 backdrop-blur-sm" (click)="closeSidebar()" aria-hidden="true"></div>

  <!-- Admin sidebar (full-width stacked on mobile, beside content on desktop) -->
  <app-admin-sidebar
    [isMobile]="isMobile()"
    [isSidebarOpen]="isSidebarOpen()"
  />

  <section class="flex h-full min-w-0 flex-1 flex-col md:ml-72 overflow-hidden">
    <!-- Mobile hamburger + title bar -->
    <header class="md:hidden h-20 px-4 flex items-center gap-4 border-b border-slate-200 bg-white z-30">
      <button
        type="button"
        (click)="toggleSidebar()"
        class="flex items-center justify-center h-10 w-10 rounded-lg text-slate-600 hover:bg-slate-100 hover:text-slate-900 transition-colors"
        [attr.aria-label]="isSidebarOpen() ? 'Close menu' : 'Open menu'"
      >
        <svg
          *ngIf="!isSidebarOpen()"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <svg
          *ngIf="isSidebarOpen()"
          class="h-6 w-6"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          viewBox="0 0 24 24"
          aria-hidden="true"
        >
          <path d="M6 6l12 12M6 18l12-12" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <h1 class="flex-1 truncate text-base font-extrabold tracking-tight text-[#1E3A5F]">InternLink GLOCAL</h1>
    </header>

    <app-admin-navbar />

    <main class="flex-1 overflow-y-auto pt-40 pb-4 px-4 md:pt-20 lg:pt-24 lg:pb-8 lg:px-8">
      <div class="mx-auto flex w-full max-w-[1600px] flex-col gap-8">
        <router-outlet />
      </div>
    </main>
  </section>
</div>
