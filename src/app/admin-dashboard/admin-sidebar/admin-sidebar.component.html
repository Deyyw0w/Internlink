<aside class="flex min-h-screen w-full lg:w-72 flex-col bg-[#1E3A5F] text-white lg:sticky lg:top-0 lg:h-screen">
  <div class="h-20 flex items-center border-b border-white/15 px-6">
    <div class="flex items-center gap-4">
      <img src="assets/logo.png" alt="USLT Logo" class="w-10 h-10 shrink-0 rounded-xl" />

      <div class="min-w-0">
        <h1 class="truncate text-base font-extrabold tracking-tight text-white">
          InternLink GLOCAL
        </h1>
        <p class="mt-1 text-sm text-slate-400">
          University Of Saint Louis Tuguegarao
        </p>
      </div>
    </div>
  </div>

  <div class="px-6 pt-6">
    <div class="flex items-center gap-3">
      <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-amber-900/20 border border-amber-500/30 text-amber-400 ring-1 ring-amber-500/20">
        <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10Z" />
          <path d="M9 12l2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <div>
        <p class="text-xs font-bold uppercase tracking-[0.25em] text-slate-400">
          GLOCAL ADMIN CONSOLE
        </p>
        <p class="mt-1 text-sm text-slate-400">
          Managing MOAs, students &amp; endorsements
        </p>
      </div>
    </div>
  </div>

  <nav class="mt-6 flex-1 px-3 pb-6">
    <a
      *ngFor="let item of menuItems; trackBy: trackBySidebar"
      #rla="routerLinkActive"
      [routerLink]="item.route"
      routerLinkActive="bg-amber-900/20 text-white ring-1 ring-amber-500/30 border-amber-500"
      [routerLinkActiveOptions]="{ exact: true }"
      class="group mb-1 flex w-full items-center gap-3 rounded-2xl border-l-4 border-transparent px-4 py-3 text-left text-sm font-medium text-slate-200 transition-colors cursor-pointer hover:bg-slate-800/50 hover:text-amber-300"
    >
      <span class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-slate-900 text-slate-400 transition group-hover:bg-slate-800 group-hover:text-slate-400"
            [ngClass]="rla.isActive ? 'bg-amber-600 text-white' : ''">
        <ng-container [ngSwitch]="item.icon">
          <svg *ngSwitchCase="'dashboard'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 11.5 12 4l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8.5Z" stroke-linejoin="round" />
          </svg>

          <svg *ngSwitchCase="'users'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21a5 5 0 0 0-10 0" stroke-linecap="round" />
            <path d="M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" />
          </svg>

          <svg *ngSwitchCase="'file-check'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
            <path d="M14 3v5h5" stroke-linejoin="round" />
            <path d="m9 15 2 2 4-4" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <svg *ngSwitchCase="'building'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 21V7l8-4 8 4v14H4Z" stroke-linejoin="round" />
            <path d="M12 3v18" stroke-linecap="round" />
            <path d="M8 11h2M8 15h2M14 11h2M14 15h2" stroke-linecap="round" />
          </svg>

          <svg *ngSwitchCase="'agency-office'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-linecap="square" stroke-miterlimit="3.5" stroke-width="1.5" aria-hidden="true">
            <path d="M2.5 12.5h19m-17 0v9m9.5-9v9h5.5v-9M6.5 8l4-4l4 4v4.5h-8Zm7.5 8.75h5.5" />
          </svg>

          <svg *ngSwitchCase="'file-contract'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 3h8l4 4v14H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
            <path d="M15 3v5h5" stroke-linejoin="round" />
            <path d="M9 13h6M9 17h5" stroke-linecap="round" />
          </svg>

          <svg *ngSwitchCase="'file-text'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M7 3h7l5 5v13a1 1 0 0 1-1 1H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" stroke-linejoin="round" />
            <path d="M14 3v5h5" stroke-linejoin="round" />
            <path d="M9 13h6M9 17h6" stroke-linecap="round" />
          </svg>

          <svg *ngSwitchCase="'chart'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 19V5" stroke-linecap="round" />
            <path d="M4 19h16" stroke-linecap="round" />
            <path d="M8 17v-5M12 17V8M16 17v-9" stroke-linecap="round" stroke-linejoin="round" />
          </svg>

          <svg *ngSwitchCase="'bell'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 21a2 2 0 0 0 4 0" stroke-linecap="round" />
          </svg>

          <svg *ngSwitchCase="'cog'" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path d="M19.42 15l1.99-1.99-1.41-1.41L18 12l1.99 1.99 1.41-1.41L19.41 10h-2.83l-.71-.71-2.82 2.82L12 14l2.83 2.83 1.41-1.41L13.41 14h2.83l.71.71zM3.77 6.32l1.41-1.41L5 5l1.41 1.41L6.41 5H3.59l-.71-.71-2.83 2.83 1.41 1.41L5 7.59l2.83-2.83L9.17 5H12l-1.41 1.41L10.59 6H13.41l.71-.71 2.83-2.83L19 3.59V6.41l-1.41 1.41L17.59 8H14l1.41 1.41L15.59 9H13l-.71.71-2.83-2.82L9.41 9H6.59l-.71-.71zm14.44 11.34L19.78 13l-1.41-1.41L17 12l1.41 1.41 1.41 1.41L19.78 14h-2.83l-.71-.71-2.82 2.82-1.41-1.41L13.41 12l2.83-2.83-1.41-1.41L10.59 12l-2.83 2.83-1.41 1.41L7 12.59l2.83-2.83L9.17 10H12l-1.41-1.41L10.59 7H13.41l.71-.71 2.83-2.83L19 5.41V12l-1.41 1.41L17.59 14H14l-1.41 1.41L15.59 15H13l1.41 1.41z" />
          </svg>

          <svg *ngSwitchCase="'admin-panel-settings'" viewBox="0 0 24 24" class="h-5 w-5" aria-hidden="true">
            <path fill="currentColor" d="M18.063 16.563q.437-.438.437-1.063t-.437-1.062T17 14t-1.062.438T15.5 15.5t.438 1.063T17 17t1.063-.437M17 20q.775 0 1.425-.363t1.05-.962q-.55-.325-1.175-.5T17 18t-1.3.175t-1.175.5q.4.6 1.05.963T17 20m-5 2q-3.475-.875-5.738-3.988T4 11.1V5l8-3l8 3v5.675q-.475-.2-.975-.363T18 10.076V6.4l-6-2.25L6 6.4v4.7q0 1.175.313 2.35t.875 2.238T8.55 17.65t1.775 1.5q.275.8.725 1.525t1.025 1.3q-.025 0-.037.013T12 22m5 0q-2.075 0-3.537-1.463T12 17t1.463-3.537T17 12t3.538 1.463T22 17t-1.463 3.538T17 22m-5-10.35"/>
          </svg>

        </ng-container>
      </span>

      <span class="flex-1">
        {{ item.label }}
      </span>

      <svg
        *ngIf="rla.isActive"
        viewBox="0 0 24 24"
        class="ml-2 h-4 w-4 text-slate-300"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path d="m9 6 6 6-6 6" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </a>
  </nav>
</aside>
