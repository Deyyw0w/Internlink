<section class="mt-8">
  <div class="mb-4 flex items-center justify-between gap-4">
    <div>
      <p class="text-xs font-bold uppercase tracking-[0.28em] text-slate-400">
        USL Programs
      </p>
      <h2 class="mt-1 text-2xl font-extrabold tracking-tight text-slate-900">
        University of Saint Louis Tuguegarao
      </h2>
      <p class="text-xs text-slate-500 mt-1">
        Live embed — updates automatically when USL uploads new programs.
      </p>
    </div>
    <a
      href="https://usl.edu.ph/programs/"
      target="_blank"
      rel="noopener noreferrer"
      class="flex items-center gap-2 px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-50 text-amber-700 border border-amber-200 hover:bg-amber-100 transition-colors"
    >
      <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 17h5l-1.44-1.44a2 2 0 0 1-.34-.34L9.17 9.17a2 2 0 0 1-.34-.34V15a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h5l2 2z" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
      Open on USL
    </a>
  </div>

  <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
    <iframe
      [src]="uslProgramsUrl"
      class="w-full h-[600px] border-0"
      allowfullscreen
      loading="lazy"
      title="USL Programs"
    ></iframe>
  </div>
</section>
