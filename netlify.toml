[build]
  command = "bash scripts/generate-env.sh && npm run build && cp dist/InternLink/browser/index.csr.html dist/InternLink/browser/index.html"
  publish = "dist/InternLink/browser"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true

[[plugins]]
package = "@netlify/angular-runtime"